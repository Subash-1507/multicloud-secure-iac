# SonarQube Cloud (formerly SonarCloud). Copy the two keys from the project's
# "Information" page after importing the repo, and turn OFF Automatic Analysis
# (Administration > Analysis Method) or the CI scan will be rejected.
sonar.organization=subash-1507-1
sonar.projectKey=Subash-1507_multicloud-secure-iac
sonar.projectName=multicloud-secure-iac

sonar.sources=terraform,ansible,.github,.devcontainer
sonar.exclusions=**/.terraform/**,**/*.tfstate*,**/*.sarif
sonar.sourceEncoding=UTF-8

# Fail the CI job when the Quality Gate fails, not just report it
sonar.qualitygate.wait=true
