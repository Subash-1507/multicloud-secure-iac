---
- name: Check the host is Debian or Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: baseline_hardening supports Debian and Ubuntu only

- name: Install security packages
  ansible.builtin.apt:
    name: "{{ baseline_hardening_packages_present }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove legacy plaintext network clients
  ansible.builtin.apt:
    name: "{{ baseline_hardening_packages_absent }}"
    state: absent
    purge: true

- name: Harden the SSH daemon
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Apply kernel network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    state: present
    reload: true
  loop: "{{ baseline_hardening_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Enable and start auditd
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true

- name: Turn on automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644" # Debian default for apt.conf.d; no secrets, non-root apt must read it

- name: Rate-limit SSH through the host firewall
  community.general.ufw:
    rule: limit
    name: OpenSSH
  when: baseline_hardening_firewall_allow_ssh | bool

- name: Deny all other inbound traffic by default
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Enable the host firewall
  community.general.ufw:
    state: enabled
